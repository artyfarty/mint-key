# config.example.yaml — copy to ~/.config/mint-key/config.yaml (or point
# $MINTK_CONFIG at it) and fill in YOUR values. Keep the real config OUT of this
# public repo. Everything here is a generic placeholder.

# CA public key — identifies the CA in agent/token modes (the private key lives
# on the YubiKey; in software mode set ca_key below instead).
ca_pub: ~/.config/mint-key/ca.pub

# Signing backend:
#   agent        CA key exposed to the ssh-agent; sign with `ssh-keygen -U`
#                (the validated WSL + Windows-agent path). RECOMMENDED.
#   token        local PKCS#11 — YubiKey attached to this machine.
#   software     a CA private key file (TESTING ONLY — never for real use).
#   wsl-delegate WSL: sign via the Windows ssh-keygen + Windows PKCS#11.
mode: agent

# Where throwaway per-scope user keys + minted certs are written (mode 700).
sessions_dir: ~/.ssh/sessions

# Optional: lock issued certs to a source IP/CIDR (unusable from elsewhere).
# Mind NAT / VPN egress addresses. Empty = off.
source_address: ""

# --- agent mode ---------------------------------------------------------------
# The CA cert subject CN — `clean` purges Windows certs whose subject matches it.
ca_cert_cn: ssh-user-ca-mintkey

# --- token mode ---------------------------------------------------------------
# PKCS#11 module path; leave empty to auto-detect libykcs11 / opensc-pkcs11.
ykcs11: ""

# --- software mode (testing only) --------------------------------------------
ca_key: ""

# --- wsl-delegate mode --------------------------------------------------------
# win_ssh_keygen: "/mnt/c/Program Files/Git/usr/bin/ssh-keygen.exe"
# win_ykcs11:     "C:\\Program Files\\Yubico\\Yubico PIV Tool\\bin\\libykcs11.dll"
# win_stage:      "/mnt/c/Users/you/.mint"

# --- windows helpers (WSL) ----------------------------------------------------
win_ykman: "/mnt/c/Program Files/Yubico/YubiKey Manager CLI/ykman.exe"

# --- scopes -------------------------------------------------------------------
# A scope maps a name to a principal (what target hosts must list in their
# AuthorizedPrincipalsFile) and a default ttl. Use YOUR real principals in your
# private config; these are placeholders.
#
# Optional: keep the scope list in a separate file — typically a private git repo —
# so it travels across machines. When set, `scopes` below is ignored and
# `mintk scopes add/edit/delete` + `mintk scopes pull/push` operate on this file.
# scopes_file: ~/work/mint-scopes/scopes.yaml
#
# Optional `group:` — a slash-separated path that files the scope into a tree,
# purely so long scope lists stay navigable in `mintk i`. It changes nothing about
# the issued cert: scope *names* remain one flat, globally unique namespace, and
# `mintk key <name>` never mentions the group. A scope without `group:` sits at
# the root. A mintk built before groups existed ignores the field.

scopes:
  - name: example-host
    principal: host-example
    ttl: 8h
    group: infra/prod
  - name: deploy
    principal: deploy-example
    ttl: 24h
    group: infra/prod
  - name: general
    principal: general
    ttl: 24h
  - name: danger
    principal: danger-example
    ttl: 1h
    group: infra/lab

# Groups that hold no scopes yet — the tree is otherwise implied by the `group:`
# fields above, so an empty group would disappear on the next write. Managed for
# you by `mintk i` → Manage scopes; you rarely need to touch this by hand.
# groups:
#   - infra/staging

# --- secret grants (optional) -------------------------------------------------
# The sibling of cert minting for *credentials*: one tap decrypts a scope's
# age blob to tmpfs for a bounded time. Delete this whole block if you only
# mint certs. Full explanation: docs/secrets.md.
secrets:
  # How the age client reaches the YubiKey (mirrors `mode:` above):
  #   native       age + age-plugin-yubikey run HERE and talk to the card (pcscd).
  #   wsl-windows  WSL runs the *Windows* age.exe through interop; the card
  #                stays on Windows. No usbipd, no pcscd in WSL. RECOMMENDED on WSL.
  #   software     a plain age X25519 identity file (TESTING ONLY, no hardware).
  mode: wsl-windows

  # Git repo holding one age blob per scope. It is end-to-end encrypted, so the
  # hosting server can never read it — but per-read auditing is impossible too.
  repo: ~/work/mint-secrets
  dir: secrets

  # age identity file. For the YubiKey plugin this is a *stub* naming the card
  # and slot — no key material — so it can live on the Windows side.
  identity: /mnt/c/Users/<you>/.age/identity.txt

  # age binary. Under wsl-windows this is the Windows age.exe; leave empty in
  # native/software mode to use `age` from PATH.
  age: /mnt/c/Users/<you>/age-tools/age.exe

  # Directory holding age-plugin-yubikey(.exe). It must be a REAL PATH entry —
  # age refuses a plugin it resolved through ".".
  plugin_dir: /mnt/c/Users/<you>/age-tools

  # Who `mintk secret edit` re-encrypts to. Include a break-glass X25519
  # recipient whose identity is in your offline backup, not only the YubiKey.
  # recipients:
  #   - age1yubikeyexampleplaceholderreplacewithyourown
  #   - age1examplebreakglassplaceholderreplacewithyourown
  recipients_file: recipients.txt   # relative to `repo`

  # Where granted plaintext lives. Must be real tmpfs (grants have to die on
  # reboot); empty = $XDG_RUNTIME_DIR/mint-key. Linux/WSL only for now.
  runtime_dir: ""
  # allow_non_tmpfs: true   # opt out of the tmpfs requirement — you should not

  default_ttl: 8h

  # Scopes are discovered from the repo (every <name>.age is usable). Entries
  # here only add policy: lifetime, how `secret run` exposes it, or a
  # non-default filename. These are placeholders.
  scopes:
    - name: example-service
      ttl: 1h
      format: env       # env = KEY=VALUE lines injected by `secret run`
    - name: example-token
      ttl: 15m
      format: opaque    # opaque = only the file path is handed to the command

# --- mintk web ----------------------------------------------------------------
# The browser UI (docs/web.md). Loopback addresses only; --listen overrides.
# Unlocked with a tap on a registered YubiKey (WebAuthn).
# web:
#   listen: localhost:7537
#   session_ttl: 12h
